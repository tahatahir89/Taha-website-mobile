<head>

    <style>
        /* =========================================================
           CONTACT PAGE — NEON BLUE / WHITE THEME
           Matches index.html, about.html, services.html, projects.html
           Scoped so it doesn't fight the shared style.css
           ========================================================= */

        :root{
            --neon: #00c3ff;
            --neon-deep: #0072ff;
            --ink: #0b1220;
            --muted: #5b6472;
            --paper: #ffffff;
            --paper-soft: #f4f8ff;
            --line: #e3edfb;
        }

        body{
            font-family: "Poppins", sans-serif;
            background: var(--paper);
            color: var(--ink);
        }

        /* ---- header override (identical to other pages) ---- */
        header.body-font{
            background: var(--paper);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        header .bg-indigo-500{
            background: linear-gradient(135deg, var(--neon), var(--neon-deep)) !important;
        }
        header nav a{
            position: relative;
            color: var(--ink);
            font-weight: 500;
            transition: color 0.25s ease;
        }
        header nav a::after{
            content: "";
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 0%;
            height: 2px;
            background: linear-gradient(90deg, var(--neon), var(--neon-deep));
            transition: width 0.3s ease;
        }
        header nav a:hover{
            color: var(--neon-deep);
        }
        header nav a:hover::after{
            width: 100%;
        }
        header button{
            background: var(--ink) !important;
            color: #fff;
            border-radius: 999px !important;
            transition: all 0.3s ease;
        }
        header button:hover{
            background: linear-gradient(90deg, var(--neon), var(--neon-deep)) !important;
            box-shadow: 0 0 20px rgba(0,195,255,0.5);
        }
        header button a{ color: #fff; }
        header button a::after{ display:none; }

        /* ---- contact section ---- */
        .contact-section{
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 90% 10%, rgba(0,195,255,0.10), transparent 45%),
                radial-gradient(circle at 5% 90%, rgba(0,114,255,0.08), transparent 40%),
                var(--paper);
        }

        /* map / address card */
        .contact-section .bg-gray-300{
            background: var(--paper-soft) !important;
            border: 1px solid var(--line);
        }
        .contact-section .bg-white.relative{
            border-radius: 12px;
            box-shadow: 0 20px 45px -15px rgba(11,18,32,0.15);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .contact-section .bg-white.relative:hover{
            transform: translateY(-4px);
            box-shadow: 0 25px 55px -15px rgba(0,114,255,0.25);
        }
        .contact-section .text-indigo-500{
            color: var(--neon-deep) !important;
            transition: color 0.25s ease;
        }
        .contact-section a.text-indigo-500:hover{
            color: var(--neon) !important;
        }

        /* form card */
        .contact-form-card{
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 32px 28px !important;
            box-shadow: 0 4px 24px rgba(11,18,32,0.05);
        }
        .contact-form-card h2{
            font-family: "Anton", sans-serif;
            font-weight: 400;
            font-size: 26px;
            letter-spacing: 0.5px;
        }
        .contact-form-card label{
            font-weight: 500;
        }
        .contact-form-card input,
        .contact-form-card textarea{
            border-radius: 10px !important;
            border-color: var(--line) !important;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .contact-form-card input:focus,
        .contact-form-card textarea:focus{
            border-color: var(--neon) !important;
            box-shadow: 0 0 0 3px rgba(0,195,255,0.18) !important;
        }

        .submit-btn{
            background: linear-gradient(90deg, var(--neon), var(--neon-deep)) !important;
            border-radius: 999px !important;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 6px 20px -4px rgba(0,114,255,0.5);
        }
        .submit-btn:hover{
            transform: translateY(-3px);
            box-shadow: 0 12px 30px -6px rgba(0,114,255,0.6);
        }

        ::selection{
            background: var(--neon);
            color: #fff;
        }
         @media (prefers-reduced-motion: reduce){
            .about-intro .bg-gray-100, .about-intro .bg-gray-100 img{
                transition: none !important;
            }
            .about-intro .bg-gray-100{
                opacity: 1;
                transform: none;
            }
          }
             @media (prefers-reduced-motion: reduce){
            .journey-card, .journey-card img, .hero img{
                transition: none !important;
            }
            .journey-card{
                opacity: 1;
                transform: none;
            }
            .resume-preview-card{
                transition: none !important;
                opacity: 1;
                transform: none;
            }
        }
    </style>
  </head>
  <body>

      </section>
      <script>
            // Resume section: scroll-reveal for the preview card
        const resumePreview = document.querySelector(".resume-preview-card");
        if (resumePreview) {
            const resumeObserver = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("in-view");
                        resumeObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.15 });
            resumeObserver.observe(resumePreview);
        }

        // Resume view/download modal
        const RESUME_PATH = "resume.pdf"; // keep in sync with where you place the PDF
        const viewResumeBtn = document.getElementById("viewResumeBtn");
        const resumeModal = document.getElementById("resumeModal");
        const resumeModalFrame = document.getElementById("resumeModalFrame");
        const closeResumeModal = document.getElementById("closeResumeModal");

        function openResumeModal() {
            resumeModalFrame.src = RESUME_PATH;
            resumeModal.classList.add("open");
            resumeModal.setAttribute("aria-hidden", "false");
            document.body.style.overflow = "hidden";
        }
        function closeResumeModalFn() {
            resumeModal.classList.remove("open");
            resumeModal.setAttribute("aria-hidden", "true");
            resumeModalFrame.src = "";
            document.body.style.overflow = "";
        }

        if (viewResumeBtn) {
            viewResumeBtn.addEventListener("click", openResumeModal);
            closeResumeModal.addEventListener("click", closeResumeModalFn);
            resumeModal.addEventListener("click", (e) => { if (e.target === resumeModal) closeResumeModalFn(); });
            document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeResumeModalFn(); });
        }
      </script>
